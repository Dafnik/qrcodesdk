name: 'Setup Playwright'
description: 'Setup Playwright with caching, using pnpm (should already be installed)'
inputs:
  browsers:
    description: 'Space-separated Playwright browser names to install'
    required: false
    default: 'chromium'
runs:
  using: 'composite'
  steps:
    # Avoid long delays on the "Processing triggers for man-db"
    # step during installation
    #
    # ```
    # pnpm playwright install --with-deps chrome
    # Installing dependencies...
    # Switching to root user to install dependencies...
    # ...
    # Processing triggers for man-db (2.12.0-4build2) ...
    # ```
    #
    # - https://github.com/actions/runner/issues/4030
    # - https://github.com/microsoft/playwright/issues/14434
    - name: Remove man-db triggers
      shell: bash
      run: sudo apt-get --yes remove --purge man-db

    - name: Extract Playwright version
      id: playwright-version
      shell: bash
      run: |
        cd packages/browser
        echo "PLAYWRIGHT_VERSION=$(jq -r '.devDependencies."playwright"' package.json)" >> $GITHUB_ENV
        cd -

    - name: Normalize browser cache key
      shell: bash
      env:
        PLAYWRIGHT_BROWSERS: ${{ inputs.browsers }}
      run: |
        browser_key=$(xargs <<< "$PLAYWRIGHT_BROWSERS" | tr ' ' '-')
        echo "PLAYWRIGHT_BROWSER_KEY=$browser_key" >> "$GITHUB_ENV"

    # Cache the selected Playwright browser binaries. System dependencies are
    # installed separately on cache hits because they are not part of this cache.
    - name: Cache Playwright
      id: playwright-cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}-${{ env.PLAYWRIGHT_BROWSER_KEY }}

    - name: Install Playwright dependencies
      shell: bash
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      env:
        PLAYWRIGHT_BROWSERS: ${{ inputs.browsers }}
      run: |
        cd packages/browser
        read -r -a browsers <<< "$PLAYWRIGHT_BROWSERS"
        pnpm exec playwright install --with-deps "${browsers[@]}"

    # On a cache hit the binary is restored but the apt system deps aren't, so
    # install just those (fast) to avoid missing-library flakiness.
    - name: Install Playwright system dependencies
      shell: bash
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      env:
        PLAYWRIGHT_BROWSERS: ${{ inputs.browsers }}
      run: |
        cd packages/browser
        read -r -a browsers <<< "$PLAYWRIGHT_BROWSERS"
        pnpm exec playwright install-deps "${browsers[@]}"
