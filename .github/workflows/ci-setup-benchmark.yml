name: CI setup benchmark
on:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node and pnpm
        uses: dafnik/setup-node-pnpm@18e728bc3a6d51ee4c93cfd96394aa6cc711b970 # v5
        with:
          install-ignore-scripts: true
      - name: Pack runtime packages
        env:
          QRCODESDK_PACKAGES: ${{ runner.temp }}/runtime-packages
        run: pnpm turbo run pack:runtime
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: benchmark-packages
          path: ${{ runner.temp }}/runtime-packages/*.tgz
  browser-baseline:
    name: baseline on ${{ matrix.browser }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
          - webkit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node and pnpm
        uses: dafnik/setup-node-pnpm@18e728bc3a6d51ee4c93cfd96394aa6cc711b970 # v5
        with:
          install-ignore-scripts: true

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright-baseline
        with:
          browsers: ${{ matrix.browser }}

      - name: Download runtime packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: benchmark-packages
          path: ${{ runner.temp }}/runtime-packages

      - name: Install runtime packages
        shell: bash
        run: |
          consumer="$RUNNER_TEMP/browser-consumer"
          mkdir -p "$consumer"
          echo '{"private":true,"type":"module"}' > "$consumer/package.json"
          npm install --prefix "$consumer" --ignore-scripts --no-audit --no-fund --package-lock=false \
            "$RUNNER_TEMP/runtime-packages/qrcodesdk-core-"*.tgz \
            "$RUNNER_TEMP/runtime-packages/qrcodesdk-browser-"*.tgz

      - name: Test installed packages
        env:
          QRCODESDK_BROWSER: ${{ matrix.browser }}
          QRCODESDK_CONSUMER: ${{ runner.temp }}/browser-consumer
        run: pnpm turbo run test:browser-runtime --filter=@qrcodesdk/browser

  browser-shell:
    name: shell on ${{ matrix.browser }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node and pnpm
        uses: dafnik/setup-node-pnpm@18e728bc3a6d51ee4c93cfd96394aa6cc711b970 # v5
        with:
          install-ignore-scripts: true

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright
        with:
          browsers: ${{ matrix.browser }}

      - name: Download runtime packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: benchmark-packages
          path: ${{ runner.temp }}/runtime-packages

      - name: Install runtime packages
        shell: bash
        run: |
          consumer="$RUNNER_TEMP/browser-consumer"
          mkdir -p "$consumer"
          echo '{"private":true,"type":"module"}' > "$consumer/package.json"
          npm install --prefix "$consumer" --ignore-scripts --no-audit --no-fund --package-lock=false \
            "$RUNNER_TEMP/runtime-packages/qrcodesdk-core-"*.tgz \
            "$RUNNER_TEMP/runtime-packages/qrcodesdk-browser-"*.tgz

      - name: Test installed packages
        env:
          QRCODESDK_BROWSER: ${{ matrix.browser }}
          QRCODESDK_CONSUMER: ${{ runner.temp }}/browser-consumer
        run: pnpm turbo run test:browser-runtime --filter=@qrcodesdk/browser

  browser-container:
    name: container on ${{ matrix.browser }}
    needs: build
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
          - webkit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node and pnpm
        uses: dafnik/setup-node-pnpm@18e728bc3a6d51ee4c93cfd96394aa6cc711b970 # v5
        with:
          install-ignore-scripts: true

      - name: Download runtime packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: benchmark-packages
          path: ${{ runner.temp }}/runtime-packages

      - name: Install runtime packages
        shell: bash
        run: |
          consumer="$RUNNER_TEMP/browser-consumer"
          mkdir -p "$consumer"
          echo '{"private":true,"type":"module"}' > "$consumer/package.json"
          npm install --prefix "$consumer" --ignore-scripts --no-audit --no-fund --package-lock=false \
            "$RUNNER_TEMP/runtime-packages/qrcodesdk-core-"*.tgz \
            "$RUNNER_TEMP/runtime-packages/qrcodesdk-browser-"*.tgz

      - name: Test installed packages
        env:
          QRCODESDK_BROWSER: ${{ matrix.browser }}
          QRCODESDK_CONSUMER: ${{ runner.temp }}/browser-consumer
        run: pnpm turbo run test:browser-runtime --filter=@qrcodesdk/browser

  framework:
    name: ${{ matrix.framework }} ${{ matrix.version }} consumer, npm cache ${{ matrix.npm-cache }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [react, next]
        npm-cache: [false, true]
        include:
          - framework: react
            version: '19'
          - framework: next
            version: '16'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node and pnpm
        uses: dafnik/setup-node-pnpm@18e728bc3a6d51ee4c93cfd96394aa6cc711b970 # v5
        with:
          install-ignore-scripts: true

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright
        with:
          browsers: chromium

      - name: Download runtime packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: benchmark-packages
          path: ${{ runner.temp }}/runtime-packages

      - name: Cache npm downloads
        if: matrix.npm-cache
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-benchmark-${{ runner.os }}-${{ matrix.framework }}-${{ matrix.version }}-${{ hashFiles(format('packages/browser/runtime/fixtures/{0}-{1}/package-lock.json', matrix.framework, matrix.version)) }}

      - name: Test framework consumer
        env:
          QRCODESDK_FRAMEWORK: ${{ matrix.framework }}
          QRCODESDK_FRAMEWORK_VERSION: ${{ matrix.version }}
          QRCODESDK_PACKAGES: ${{ runner.temp }}/runtime-packages
        run: pnpm turbo run test:framework-runtime --filter=@qrcodesdk/browser
