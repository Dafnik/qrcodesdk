name: Development

on:
  pull_request:
  push:
    branches:
      - main
      - develop

concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commitlint:
    name: Commitlint Check
    runs-on: ubuntu-latest
    steps:
      # Needed to get the commitlint config
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run commitlint
        uses: dafnik/commitlint@ff572ed77bd50caa1fba2ad1bc0f179aa6a21ba4 # v1

  verify:
    name: Verify
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node and pnpm
        uses: dafnik/setup-node-pnpm@18e728bc3a6d51ee4c93cfd96394aa6cc711b970 # v5
        with:
          install-ignore-scripts: true

      - name: Cache for Turbo
        uses: rharkor/caching-for-turbo@760158c05c47e7a764f78e9a22ca3b5a6ed8c52e # v2.5.2

      - name: Check formatting
        run: pnpm turbo run format:check

      - name: Lint
        run: pnpm turbo run lint

      - name: Check spellings
        run: pnpm turbo run cspell

      - name: Check terminology
        run: pnpm turbo run terminology

      - name: Check types
        run: pnpm turbo run check-types

  build:
    name: Build and package monorepo
    runs-on: ubuntu-latest
    outputs:
      playwright-version: ${{ steps.playwright-version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node and pnpm
        uses: dafnik/setup-node-pnpm@18e728bc3a6d51ee4c93cfd96394aa6cc711b970 # v5
        with:
          install-ignore-scripts: true

      - name: Cache for Turbo
        uses: rharkor/caching-for-turbo@760158c05c47e7a764f78e9a22ca3b5a6ed8c52e # v2.5.2

      - name: Resolve Playwright image version
        id: playwright-version
        shell: bash
        run: |
          version=$(pnpm --filter @qrcodesdk/browser exec playwright --version)
          echo "version=${version#Version }" >> "$GITHUB_OUTPUT"

      - name: Build everything
        run: pnpm turbo run build

      - name: Pack runtime packages
        env:
          QRCODESDK_PACKAGES: ${{ runner.temp }}/runtime-packages
        run: pnpm turbo run pack:runtime

      - name: Upload runtime packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: runtime-packages
          path: ${{ runner.temp }}/runtime-packages/*.tgz
          if-no-files-found: error
          retention-days: 1

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: apps/docs/dist
          retention-days: 1

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node and pnpm
        uses: dafnik/setup-node-pnpm@18e728bc3a6d51ee4c93cfd96394aa6cc711b970 # v5
        with:
          install-ignore-scripts: true

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Cache for Turbo
        uses: rharkor/caching-for-turbo@760158c05c47e7a764f78e9a22ca3b5a6ed8c52e # v2.5.2

      - name: Test
        run: pnpm turbo run test

  roundtrips:
    name: Roundtrip tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node and pnpm
        uses: dafnik/setup-node-pnpm@18e728bc3a6d51ee4c93cfd96394aa6cc711b970 # v5
        with:
          install-ignore-scripts: true

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright

      - name: Cache for Turbo
        uses: rharkor/caching-for-turbo@760158c05c47e7a764f78e9a22ca3b5a6ed8c52e # v2.5.2

      - name: Test roundtrips
        run: pnpm turbo run test:roundtrips --filter=@repo/core-testing --filter=@qrcodesdk/browser --filter=@qrcodesdk/node

  runtime:
    name: ${{ matrix.package }} on ${{ matrix.runtime }} ${{ matrix.version }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: core
            runtime: node
            version: 22.0.0
          - package: core
            runtime: node
            version: 24.x
          - package: core
            runtime: node
            version: 26.x
          - package: core
            runtime: deno
            version: v2.x
          - package: core
            runtime: bun
            version: latest
          - package: node
            runtime: node
            version: 22.0.0
          - package: node
            runtime: node
            version: 24.x
          - package: node
            runtime: node
            version: 26.x
          - package: node
            runtime: deno
            version: v2.x
          - package: node
            runtime: bun
            version: latest
          - package: cli
            runtime: node
            version: 22.12.0
          - package: cli
            runtime: node
            version: 24.x
          - package: cli
            runtime: node
            version: 26.x
          - package: cli
            runtime: deno
            version: v2.x
          - package: cli
            runtime: bun
            version: latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        if: matrix.runtime == 'node'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.version }}
          package-manager-cache: false

      - name: Setup Node for package installation
        if: matrix.runtime == 'deno'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Setup Deno
        if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: ${{ matrix.version }}

      - name: Setup Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ matrix.version }}

      - name: Download runtime packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: runtime-packages
          path: ${{ runner.temp }}/runtime-packages

      - name: Test installed package
        shell: bash
        env:
          PACKAGE: ${{ matrix.package }}
          RUNTIME: ${{ matrix.runtime }}
        run: |
          consumer="$RUNNER_TEMP/${PACKAGE}-${RUNTIME}-consumer"
          mkdir -p "$consumer"
          echo '{"private":true,"type":"module"}' > "$consumer/package.json"

          case "$PACKAGE" in
            core)
              tarballs=("$RUNNER_TEMP/runtime-packages/qrcodesdk-core-"*.tgz)
              package_specs=("@qrcodesdk/core=${tarballs[0]}")
              cp packages/core/runtime/smoke-package.mjs "$consumer"
              ;;
            node)
              tarballs=(
                "$RUNNER_TEMP/runtime-packages/qrcodesdk-core-"*.tgz
                "$RUNNER_TEMP/runtime-packages/qrcodesdk-node-"*.tgz
              )
              package_specs=(
                "@qrcodesdk/core=${tarballs[0]}"
                "@qrcodesdk/node=${tarballs[1]}"
              )
              cp packages/node/runtime/smoke-package.mjs "$consumer"
              ;;
            cli)
              tarballs=(
                "$RUNNER_TEMP/runtime-packages/qrcodesdk-core-"*.tgz
                "$RUNNER_TEMP/runtime-packages/qrcodesdk-node-"*.tgz
                "$RUNNER_TEMP/runtime-packages/qrcodesdk-cli-"*.tgz
              )
              package_specs=(
                "@qrcodesdk/core=${tarballs[0]}"
                "@qrcodesdk/node=${tarballs[1]}"
                "@qrcodesdk/cli=${tarballs[2]}"
              )
              cp packages/cli/runtime/smoke-package.mjs "$consumer"
              ;;
          esac

          cd "$consumer"
          if [ "$RUNTIME" = 'bun' ]; then
            bun -e '
              const dependencies = Object.fromEntries(
                process.argv
                  .filter((argument) => argument.startsWith("@qrcodesdk/"))
                  .map((spec) => {
                    const separator = spec.indexOf("=");
                    return [spec.slice(0, separator), `file:${spec.slice(separator + 1)}`];
                  }),
              );
              await Bun.write(
                "package.json",
                JSON.stringify({private: true, type: "module", dependencies, overrides: dependencies}),
              );
            ' -- "${package_specs[@]}"
            bun install --ignore-scripts --no-save
          else
            if [ "$RUNTIME" = 'node' ]; then
              npm config set engine-strict true --location=project
            fi
            npm install --ignore-scripts --no-audit --no-fund --package-lock=false "${tarballs[@]}"
          fi

          case "$RUNTIME" in
            node)
              QRCODESDK_RUNTIME=node node smoke-package.mjs
              ;;
            deno)
              QRCODESDK_RUNTIME=deno deno run -A --node-modules-dir=manual smoke-package.mjs
              ;;
            bun)
              QRCODESDK_RUNTIME=bun bun run smoke-package.mjs
              ;;
          esac

  browser-runtime:
    name: Browser package on ${{ matrix.browser }}
    needs: build
    runs-on: ubuntu-latest
    # WebKit's system dependency installation costs more than pulling the image.
    # Resolve the image tag from the installed package to keep browsers in sync.
    container: ${{ matrix.browser == 'webkit' && format('mcr.microsoft.com/playwright:v{0}-noble', needs.build.outputs.playwright-version) || '' }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        browser:
          - chromium
          - firefox
          - webkit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node and pnpm
        uses: dafnik/setup-node-pnpm@18e728bc3a6d51ee4c93cfd96394aa6cc711b970 # v5
        with:
          install-ignore-scripts: true

      - name: Setup Playwright
        if: matrix.browser != 'webkit'
        uses: ./.github/actions/setup-playwright
        with:
          browsers: ${{ matrix.browser }}

      - name: Download runtime packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: runtime-packages
          path: ${{ runner.temp }}/runtime-packages

      - name: Install runtime packages
        shell: bash
        run: |
          consumer="$RUNNER_TEMP/browser-consumer"
          mkdir -p "$consumer"
          echo '{"private":true,"type":"module"}' > "$consumer/package.json"
          npm install --prefix "$consumer" --ignore-scripts --no-audit --no-fund --package-lock=false \
            "$RUNNER_TEMP/runtime-packages/qrcodesdk-core-"*.tgz \
            "$RUNNER_TEMP/runtime-packages/qrcodesdk-browser-"*.tgz

      - name: Test installed packages
        env:
          QRCODESDK_BROWSER: ${{ matrix.browser }}
          QRCODESDK_CONSUMER: ${{ runner.temp }}/browser-consumer
        run: pnpm turbo run test:browser-runtime --filter=@qrcodesdk/browser

  framework-runtime:
    name: ${{ matrix.framework }} ${{ matrix.version }} consumer
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - framework: react
            version: '18'
          - framework: react
            version: '19'
          - framework: next
            version: '15'
          - framework: next
            version: '16'
          - framework: angular
            version: '20'
          - framework: angular
            version: '21'
          - framework: angular
            version: '22'
          - framework: vue
            version: '3.3'
          - framework: vue
            version: '3.5'
          - framework: svelte
            version: '5.0'
          - framework: svelte
            version: '5.56'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node and pnpm
        uses: dafnik/setup-node-pnpm@18e728bc3a6d51ee4c93cfd96394aa6cc711b970 # v5
        with:
          install-ignore-scripts: true

      - name: Setup Playwright
        uses: ./.github/actions/setup-playwright
        with:
          browsers: chromium

      - name: Download runtime packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: runtime-packages
          path: ${{ runner.temp }}/runtime-packages

      - name: Test framework consumer
        env:
          QRCODESDK_FRAMEWORK: ${{ matrix.framework }}
          QRCODESDK_FRAMEWORK_VERSION: ${{ matrix.version }}
          QRCODESDK_PACKAGES: ${{ runner.temp }}/runtime-packages
        run: pnpm turbo run test:framework-runtime --filter=@qrcodesdk/browser

  react-native-runtime:
    name: React Native ${{ matrix.version }} consumer
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version:
          - '0.79'
          - '0.88'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node and pnpm
        uses: dafnik/setup-node-pnpm@18e728bc3a6d51ee4c93cfd96394aa6cc711b970 # v5
        with:
          install-ignore-scripts: true

      # The standalone Hermes CLI runs the smoke bundles. React Native ships only the compiler.
      - name: Setup Hermes
        shell: bash
        env:
          HERMES_SHA256: aead6eb0b8f563bb022354352eae32dad96c933330b6c1941b6db17674ca68ae
        run: |
          hermes_dir="$RUNNER_TEMP/hermes"
          mkdir -p "$hermes_dir"
          curl --fail --location --silent --show-error \
            --output "$hermes_dir/hermes-cli-linux.tar.gz" \
            https://github.com/facebook/hermes/releases/download/v0.13.0/hermes-cli-linux.tar.gz
          echo "$HERMES_SHA256  $hermes_dir/hermes-cli-linux.tar.gz" | sha256sum --check
          tar -xzf "$hermes_dir/hermes-cli-linux.tar.gz" -C "$hermes_dir"

      - name: Download runtime packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: runtime-packages
          path: ${{ runner.temp }}/runtime-packages

      - name: Test React Native consumer
        env:
          QRCODESDK_HERMES: ${{ runner.temp }}/hermes/hermes
          QRCODESDK_PACKAGES: ${{ runner.temp }}/runtime-packages
          QRCODESDK_REACT_NATIVE_VERSION: ${{ matrix.version }}
        run: pnpm turbo run test:react-native-runtime --filter=@qrcodesdk/react-native

  native-ios:
    name: Native rendering on iOS
    needs: build
    runs-on: macos-26
    timeout-minutes: 60
    env:
      CCACHE_DIR: ${{ github.workspace }}/apps/native-example/.tools/ccache
      CCACHE_MAXSIZE: 500M
      USE_CCACHE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node and pnpm
        uses: dafnik/setup-node-pnpm@18e728bc3a6d51ee4c93cfd96394aa6cc711b970 # v5
        with:
          install-ignore-scripts: true

      - name: Cache for Turbo
        uses: rharkor/caching-for-turbo@760158c05c47e7a764f78e9a22ca3b5a6ed8c52e # v2.5.2

      - name: Setup Java for Maestro
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare iOS compiler cache
        id: ios-cache
        run: pnpm turbo run native:cache:ios --filter=native-example

      - name: Cache native dependency downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
            ~/Library/Caches/ReactNative
          key: native-ios-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.ios-cache.outputs.toolchain }}-${{ hashFiles('pnpm-lock.yaml', 'apps/native-example/app.json') }}

      # ccache looks objects up by content, so any entry for the same toolchain is safe to restore.
      # Prefer one built from the same dependencies, then fall back to the latest for the toolchain.
      - name: Restore native compilation cache
        id: compiler-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: apps/native-example/.tools/ccache
          key: native-ios-compiler-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.ios-cache.outputs.toolchain }}-${{ hashFiles('pnpm-lock.yaml', 'apps/native-example/app.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            native-ios-compiler-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.ios-cache.outputs.toolchain }}-${{ hashFiles('pnpm-lock.yaml', 'apps/native-example/app.json') }}-
            native-ios-compiler-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.ios-cache.outputs.toolchain }}-

      - name: Install Maestro
        run: pnpm turbo run native:tools --filter=native-example

      - name: Build and test on an iPhone simulator
        env:
          CI: '1'
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '120000'
        run: pnpm turbo run test:native:ios --filter=native-example

      - name: Upload native screenshots and test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-ios
          path: apps/native-example/artifacts/ios
          if-no-files-found: warn
          retention-days: 7

      - name: Report compiler cache statistics
        if: always() && steps.ios-cache.outcome == 'success'
        run: pnpm turbo run native:cache:ios --filter=native-example -- --stats

      # Each entry can hold up to 500 MB. Only pushes to main and develop save one, so pull request
      # runs cannot evict other caches. Pull requests restore entries saved by their base branch.
      - name: Save native compilation cache
        if: always() && github.event_name == 'push' && steps.compiler-cache.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: apps/native-example/.tools/ccache
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

  native-android:
    name: Native rendering on Android
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node and pnpm
        uses: dafnik/setup-node-pnpm@18e728bc3a6d51ee4c93cfd96394aa6cc711b970 # v5
        with:
          install-ignore-scripts: true

      - name: Cache for Turbo
        uses: rharkor/caching-for-turbo@760158c05c47e7a764f78e9a22ca3b5a6ed8c52e # v2.5.2

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Install Maestro
        run: pnpm turbo run native:tools --filter=native-example

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build and test on an Android emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          CI: '1'
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '120000'
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: pnpm turbo run test:native:android --filter=native-example

      - name: Upload native screenshots and test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-android
          path: apps/native-example/artifacts/android
          if-no-files-found: warn
          retention-days: 7

  required:
    name: required
    if: always()
    needs:
      - commitlint
      - build
      - verify
      - test
      - roundtrips
      - runtime
      - browser-runtime
      - framework-runtime
      - react-native-runtime
      - native-ios
      - native-android
    runs-on: ubuntu-latest
    steps:
      - name: Require every development job
        if: >-
          needs.commitlint.result != 'success' ||
          needs.build.result != 'success' ||
          needs.verify.result != 'success' ||
          needs.test.result != 'success' ||
          needs.roundtrips.result != 'success' ||
          needs.runtime.result != 'success' ||
          needs['browser-runtime'].result != 'success' ||
          needs['framework-runtime'].result != 'success' ||
          needs['react-native-runtime'].result != 'success' ||
          needs['native-ios'].result != 'success' ||
          needs['native-android'].result != 'success'
        run: exit 1

      - name: Report success
        run: echo 'Every development check succeeded.'

  deploy-docs-prod:
    if: github.ref == 'refs/heads/main'
    name: Deploy docs
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: required
    permissions:
      actions: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
