name: release @qrcodesdk/react-native

on:
  push:
    tags:
      - '@qrcodesdk/react-native@**'

permissions:
  id-token: write # Required for OIDC
  contents: write # Required for GitHub release action

jobs:
  react-native:
    uses: ./.github/workflows/release.yml
    with:
      lib: react-native
    secrets:
      npm_token: ${{ secrets.NPM_TOKEN }}
