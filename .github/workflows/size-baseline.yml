name: Update size baseline

on:
  schedule:
    - cron: '0 3 * * *'
      timezone: 'Europe/Vienna'
  workflow_dispatch:

permissions:
  contents: read

cache-mode: read

concurrency:
  group: size-baseline
  cancel-in-progress: false

jobs:
  measure:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      commit: ${{ steps.checkout.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        id: checkout
        with:
          ref: main
          persist-credentials: false

      - name: Setup Node and pnpm
        uses: dafnik/setup-node-pnpm@18e728bc3a6d51ee4c93cfd96394aa6cc711b970 # v5
        with:
          node: '26.13.1'
          install-ignore-scripts: true

      - name: Measure all scenarios, bundlers and packages
        run: pnpm turbo run report:size --filter=@repo/perf

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: daily-size-baseline
          path: packages/perf/reports/size.json
          if-no-files-found: error
          retention-days: 1

  commit:
    needs: measure
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    cache-mode: none
    steps:
      # The App token is created last and never reaches a package manager or build command.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: daily-size-baseline
          path: ${{ runner.temp }}/size-baseline

      # main is protected; only the baseline App may bypass its ruleset.
      - name: Create baseline App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SIZE_BASELINE_APP_CLIENT_ID }}
          private-key: ${{ secrets.SIZE_BASELINE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Commit baseline file to main
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          SIZE_SOURCE_COMMIT: ${{ needs.measure.outputs.commit }}
          SIZE_REPORT: ${{ runner.temp }}/size-baseline/size.json
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const {commitSizeBaseline} = await import(`${process.env.GITHUB_WORKSPACE}/packages/perf/src/size/github.ts`);
            await commitSizeBaseline(github, context.repo, process.env.SIZE_REPORT, process.env.SIZE_SOURCE_COMMIT);
