name: Size measurements

on:
  pull_request:

permissions:
  contents: read

# Repository API permissions and cache permissions are separate controls.
cache-mode: read

concurrency:
  group: size-measurements-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  measure:
    name: PR size report
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # The default pull_request checkout is the PR merged onto its target branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node and pnpm
        uses: dafnik/setup-node-pnpm@18e728bc3a6d51ee4c93cfd96394aa6cc711b970 # v5
        with:
          node: '26.13.1'
          install-ignore-scripts: true

      - name: Measure all scenarios, bundlers and packages
        run: pnpm turbo run report:size --filter=@repo/perf

      - name: Upload size report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: size-report
          path: packages/perf/reports/size.json
          if-no-files-found: warn
          retention-days: 14
